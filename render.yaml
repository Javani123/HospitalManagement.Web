services:
  - type: web
    name: HospitalManagementWeb
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your backend API URL, e.g., https://hospitalmanagementapi.onrender.com/api
